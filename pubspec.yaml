name: arabic_mmorpg
description: An Arabic MMORPG game based on "الفتح: طريق الانتقام" using Flutter/Dart and Flame.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Game engine
  flame: ^1.10.0
  flame_audio: ^2.1.0
  flame_tiled: ^1.15.0
  
  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Networking
  dio: ^5.3.0
  web_socket_channel: ^2.4.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # Authentication
  firebase_core: ^2.15.0
  firebase_auth: ^4.7.2
  cloud_firestore: ^4.8.4
  
  # Utilities
  shared_preferences: ^2.2.0
  intl: ^0.18.0
  logger: ^2.0.1
  uuid: ^3.0.7
  
  # UI
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  lottie: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2
  build_runner: ^2.4.6
  mockito: ^5.4.2
  bloc_test: ^9.1.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/characters/
    - assets/images/monsters/
    - assets/images/maps/
    - assets/images/items/
    - assets/images/ui/
    - assets/images/effects/
    - assets/audio/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/maps/
    - assets/fonts/
    - assets/data/
    
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic